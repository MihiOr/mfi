name: Tests
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/mfi_example
  cortex-m3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - run: python -m pip install -r tests/requirements.txt
      - run: cmake -S . -B build/arm -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake -DMFI_BUILD_STM32F1=ON -DMFI_BUILD_TESTS=OFF -DMFI_BUILD_EXAMPLES=OFF
      - run: cmake --build build/arm --parallel
      - run: python tests/arm_transport_tests.py build/arm/transport.elf
